<svg xmlns="http://www.w3.org/2000/svg" width="495" height="165" viewBox="0 0 495 165" role="img" aria-label="Contribution streak">
  <title>Contribution streak</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #0891b2; }
    .label { font-size: 13px; fill: #6e7781; }
    .value { font-size: 15px; font-weight: 600; fill: #24292f; }
  </style>
  <rect x="0.5" y="0.5" rx="6" width="494" height="164" fill="#ffffff" stroke="#e4e2e2"/>
  <text x="25" y="32" class="title">Contribution streak</text>
  <text x="82" y="89" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#24292f">5</text>
  <text x="82" y="136" text-anchor="middle" class="label" style="fill:#24292f;font-weight:600">Contributions</text>
  <text x="82" y="151" text-anchor="middle" class="label" style="font-size:11px">past year</text>
  <circle cx="247" cy="84" r="31" fill="none" stroke="#0891b2" stroke-width="4"/>
  <text x="247" y="91" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#0891b2">1</text>
  <text x="247" y="136" text-anchor="middle" class="label" style="fill:#24292f;font-weight:600">Current streak</text>
  <text x="247" y="151" text-anchor="middle" class="label" style="font-size:11px">days</text>
  <text x="412" y="89" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#24292f">1</text>
  <text x="412" y="136" text-anchor="middle" class="label" style="fill:#24292f;font-weight:600">Longest streak</text>
  <text x="412" y="151" text-anchor="middle" class="label" style="font-size:11px">days, past year</text>
</svg>
